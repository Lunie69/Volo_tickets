<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<title>Вход</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h1>Вход администратора</h1>

<form method="POST">

<input
type="text"
name="username"
placeholder="Логин"
required>

<input
type="password"
name="password"
placeholder="Пароль"
required>

<button>

Войти

</button>

</form>

{% if error %}

<p style="color:red;margin-top:15px">

{{ error }}

</p>

{% endif %}

</div>

</body>
</html>
